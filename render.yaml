databases:
  - name: artha-db
    plan: free
    databaseName: artha
    user: artha_user

services:
  # Artha Intelligent Financial Operating System (Unified Web + API + WhatsApp Engine)
  - type: web
    name: artha-finance
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: artha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_ACCESS_TOKEN
        sync: false
      - key: META_WA_VERIFY_TOKEN
        value: artha_webhook_token
